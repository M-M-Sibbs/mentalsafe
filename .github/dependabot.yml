version: 2

updates:
  # Security patches for the web app. Weekly, grouped so routine bumps arrive
  # as one PR rather than a dozen.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      production:
        dependency-type: production
      development:
        dependency-type: development

  # Keeps the CI actions themselves current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
