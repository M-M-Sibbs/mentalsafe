name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    name: Web — typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The scoring tests are the ones that actually matter — a silent bug in
      # a clinical threshold is the worst failure mode this project has.
      - name: Scoring tests
        run: npm test

      - name: Build
        run: npm run build

      # Fails the build on a known-vulnerable dependency. This project shipped
      # with a critical Next.js RCE once; this is here so it cannot happen
      # quietly again.
      - name: Audit dependencies
        run: npm audit --audit-level=high
